<html lang="en">
  <head>

    <meta name="theme-color" content="#1A1A20" />

      name="description"
      content="A pioneering hamster-powered proof-of-work blockchain looking for miners. Ready to earn $SQK?"

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
